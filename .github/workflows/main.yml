name: Construir APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar dependencias
        run: npm install

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos e icono
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />#' "$MANIFEST"
          rm -rf android/app/src/main/res/mipmap-anydpi-v26
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp icons/$d/*.png android/app/src/main/res/mipmap-$d/
          done

      - name: Copiar la app
        run: npx cap sync android

      - name: Compilar APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-te-llama-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
        
